services:
  designdraft:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    # Agent config (provider/model/keys) + auth token come from .env.local.
    # Do NOT also list them under `environment:` — that block overrides env_file,
    # and `${VAR:-}` would resolve empty from the host shell and clobber them.
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DESIGNDRAFT_WORKSPACE_DIR: /app/.workspace
    volumes:
      - designdraft_workspace:/app/.workspace
    restart: unless-stopped

volumes:
  designdraft_workspace:
